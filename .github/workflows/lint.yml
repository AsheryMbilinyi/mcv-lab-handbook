name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install black isort flake8 mypy
      - name: isort
        run: isort --check-only --diff .
      - name: black
        run: black --check --diff .
      - name: flake8
        run: flake8 .
      - name: mypy
        run: mypy drills
